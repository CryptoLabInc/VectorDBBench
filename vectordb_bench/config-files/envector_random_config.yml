# Custom Case
_base_dataset: &base_dataset
  case_type: PerformanceCustomDataset
  custom_case_name: RANDOM512D1M
  custom_case_description: RANDOM512D1M benchmark (512D, 1M vectors)
  custom_dataset_name: RANDOM512D1M
  custom_dataset_dir: ""
  custom_dataset_size: 1000000
  custom_dataset_dim: 512
  custom_dataset_file_count: 1
  custom_dataset_use_shuffled: false
  custom_dataset_with_gt: true
  k: 10

# envector server settings
_base_envector: &base_envector
  uri: localhost:50050
  eval_mode: mm
  drop_old: true
  load: true

# FLAT
envectorflat:
  <<: [*base_dataset, *base_envector]
  index_name: random512d1m_flat
  db_label: RANDOM512D1M-FLAT
  
# IVF-FLAT with trained k-means centroids
envectorivfflat:
  <<: [*base_dataset, *base_envector]
  index_name: random512d1m_ivfflat
  db_label: RANDOM512D1M-IVFFLAT
  nlist: 256
  nprobe: 6
  train_centroids: true
  centroids_path: centroids/random512d1m/centroids_256.npy